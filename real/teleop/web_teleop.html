<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SO-101 teleop</title>
<style>
:root{--bg:#141618;--fg:#ecedea;--dim:#9aa0a6;--acc:#e0651f;--bad:#e5484d;--ok:#3fb950;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px/1.3 -apple-system,Segoe UI,Roboto,sans-serif;overscroll-behavior:none;overflow:hidden;touch-action:none}
#app{height:100dvh;padding:var(--sat) 0 var(--sab);display:grid;grid-template-rows:minmax(0,1fr) auto auto auto;grid-template-columns:1fr;gap:4px}
.cams{display:grid;grid-template-rows:minmax(0,3fr) minmax(0,2fr);gap:4px;padding:4px 4px 0;min-height:0}
.camwrap{position:relative;min-height:0;background:#000;border-radius:8px;overflow:hidden}
.camwrap img,.camwrap video{width:100%;height:100%;object-fit:contain;display:block}
.camwrap .tag{position:absolute;left:8px;top:6px;font:11px ui-monospace,monospace;color:var(--dim);background:rgba(0,0,0,.45);padding:2px 6px;border-radius:4px}
.lim{display:none;position:absolute;inset:0;border:4px solid var(--bad);border-radius:8px;pointer-events:none}
.lim.on{display:block}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
button.warn{box-shadow:inset 0 0 0 3px rgba(229,72,77,var(--w,0))}
.status{font-family:ui-monospace,monospace;font-size:clamp(10px,2.9vw,13px);color:var(--dim);padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status b{color:var(--fg)}
.griprow{display:flex;gap:10px;padding:2px 12px;align-items:center}
.griprow input[type=range]{flex:1;height:44px;accent-color:var(--acc);margin:0}
.small{font-size:12px;color:var(--dim);min-width:3.2em;text-align:right}
.ctl{display:grid;grid-template-rows:auto auto;gap:8px;padding:4px 10px 8px}
.joys{display:grid;grid-template-columns:1fr 1fr;gap:12px;justify-items:center}
.joy{position:relative;width:min(100%,26vh);aspect-ratio:1;background:#1f2326;border-radius:50%;border:2px solid #2c3136;touch-action:none}
.knob{position:absolute;width:38%;height:38%;left:31%;top:31%;border-radius:50%;background:var(--acc);opacity:.9}
#joy2 .knob{background:#4A90D9}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btns #stop{grid-column:span 2}
#role,#rec{background:#2a2f34}
#role.on{background:#2f6b3a}
#rec.on{background:var(--bad)}

.lbl{position:absolute;font-size:11px;color:var(--dim)}
.side{display:contents}
.col{display:grid;grid-template-rows:repeat(4,minmax(44px,1fr));gap:8px;min-height:0}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{background:#2a2f34;color:var(--fg);border:0;border-radius:12px;padding:0 6px;font-size:clamp(14px,4vw,17px);font-weight:600;min-height:44px;touch-action:none}
button:active{background:#3a4148}
button.stop{background:var(--bad)}
@media (orientation:landscape){
  #app{grid-template-rows:minmax(0,1fr) auto;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);grid-template-areas:"cams ctl" "status status"}
  .cams{grid-area:cams;grid-template-rows:none;grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding:4px 0 4px 4px}
  .status{grid-area:status}
  .side{grid-area:ctl;display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;padding-right:4px}
  .joy{width:min(100%,34vh)}
}
</style></head><body><div id="app">
<div class="cams">
  <div class="camwrap"><video id="wimg" autoplay muted playsinline></video><span class="tag">кисть</span><canvas id="ov"></canvas></div>
  <div class="camwrap"><video id="timg" autoplay muted playsinline></video><span class="tag">сверху</span><div id="limT" class="lim"></div></div>
</div>
<div class="side">
<div class="griprow"><span class="small" style="text-align:left">схват</span><input id="grip" type="range" min="0" max="100" value="0"><span id="gv" class="small">0 %</span></div>
<div class="ctl">
  <div class="joys">
    <div class="joy" id="joy"><div class="knob"></div><span class="lbl" style="top:6px;left:50%;transform:translateX(-50%)">вглубь кадра</span><span class="lbl" style="bottom:6px;left:50%;transform:translateX(-50%)">к себе</span><span class="lbl" style="left:6px;top:50%;transform:translateY(-50%)">влево</span><span class="lbl" style="right:6px;top:50%;transform:translateY(-50%)">вправо</span></div>
    <div class="joy" id="joy2"><div class="knob"></div><span class="lbl" style="top:6px;left:50%;transform:translateX(-50%)">наклон вперёд</span><span class="lbl" style="bottom:6px;left:50%;transform:translateX(-50%)">сверху</span><span class="lbl" style="left:6px;top:50%;transform:translateY(-50%)">⟲</span><span class="lbl" style="right:6px;top:50%;transform:translateY(-50%)">⟳</span></div>
  </div>
  <div class="btns">
    <button class="hold warn" data-k="vz" data-v="1">▲ выше</button><button class="hold warn" data-k="vz" data-v="-1">▼ ниже</button>
    <button id="home">Домой</button><button id="park">Парковка</button>
    <button id="stop" class="stop">СТОП</button><button id="role">…</button><button id="rec">Запись</button>
    <button onclick="location.href='/xr'+location.search" style="background:#2a3a4a">AR</button><button onclick="location.href='/tilt'+location.search" style="background:#2a3a4a">Наклоны</button>
  </div>
</div>
</div>
<div class="status" id="st">подключение…</div>
</div>
<script>
const q=location.search;
const cmd={vx:0,vy:0,vz:0,wyaw:0,wpitch:0,grip:null};
// видео: сначала WebRTC (низкая задержка), если за 4 с не соединилось — MJPEG
async function startVideo(map){ // map: {wrist: <video|img element>, top: ...}
  const fallback=()=>{for(const [cam,el] of Object.entries(map)){ if(el.tagName==='VIDEO'){const im=document.createElement('img'); im.alt=cam; im.style.cssText=el.style.cssText; im.className=el.className; im.id=el.id; el.replaceWith(im); im.src='/cam/'+cam+'.mjpg'+q;} else el.src='/cam/'+cam+'.mjpg'+q;} document.body.dataset.video='mjpeg';};
  if(!window.RTCPeerConnection){fallback(); return;}
  try{
    const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
    pc.addTransceiver('video',{direction:'recvonly'}); pc.addTransceiver('video',{direction:'recvonly'});
    const els=[map.wrist,map.top]; let i=0;
    pc.ontrack=ev=>{const el=els[i++]; if(el&&el.tagName==='VIDEO'){el.srcObject=new MediaStream([ev.track]); el.play().catch(()=>{});}};
    const offer=await pc.createOffer(); await pc.setLocalDescription(offer);
    await new Promise(r=>{if(pc.iceGatheringState==='complete')r(); else{pc.onicegatheringstatechange=()=>{if(pc.iceGatheringState==='complete')r();}; setTimeout(r,1500);}});
    const resp=await fetch('/rtc/offer'+q,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sdp:pc.localDescription.sdp,type:pc.localDescription.type})});
    if(!resp.ok) throw new Error('offer '+resp.status);
    await pc.setRemoteDescription(await resp.json());
    const ok=await new Promise(r=>{const t=setTimeout(()=>r(false),4000); pc.onconnectionstatechange=()=>{if(pc.connectionState==='connected'){clearTimeout(t);r(true);} if(['failed','closed'].includes(pc.connectionState)){clearTimeout(t);r(false);}};});
    if(!ok){pc.close(); fallback();} else document.body.dataset.video='webrtc';
  }catch(e){fallback();}
}
startVideo({wrist:document.getElementById('wimg'), top:document.getElementById('timg')});
let ws, stopped=false;
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
  ws.onmessage=e=>{const s=JSON.parse(e.data);
    document.getElementById('st').innerHTML=`схват <b>${s.tcp[0]}</b> <b>${s.tcp[1]}</b> <b>${s.tcp[2]}</b> м · yaw ${s.yaw_deg}° наклон ${s.pitch_deg??0}° · ${s.alive?'<span style="color:var(--ok)">связь</span>':'<span style="color:var(--bad)">нет связи</span>'} ${document.body.dataset.video||''} ${s.stop?'· <span style="color:var(--bad)">СТОП-ФАЙЛ</span>':''} ${s.msg?'· '+s.msg:''}`;
    const lim=s.limits; const on=lim.x||lim.y||lim.z||lim.r||lim.ik;
    document.getElementById('limT').classList.toggle('on',on);
    drawBlocks(s.blocks||[], on&&lim.ik&&!(s.blocks||[]).length);
    document.querySelector('[data-k="vz"][data-v="1"]').style.setProperty('--w', s.up||0);
    document.querySelector('[data-k="vz"][data-v="-1"]').style.setProperty('--w', s.down||0);
    stopped=s.stop; document.getElementById('stop').textContent=stopped?'Продолжить':'СТОП'; applyRole(s);};
  ws.onclose=()=>setTimeout(connect,1000);
}
connect();
setInterval(()=>{if(ws&&ws.readyState===1){ws.send(JSON.stringify(cmd)); cmd.grip=null;}},50);
// два джойстика: левый — движение в осях кадра, правый — поворот губок (x) и наклон подхода (y)
function bindJoy(el, onMove){const knob=el.querySelector('.knob'); let id=null;
  const set=(x,y)=>{knob.style.left=(31+x*31)+'%'; knob.style.top=(31+y*31)+'%'; onMove(x,y);};
  const mv=e=>{const r=el.getBoundingClientRect(); let x=((e.clientX-r.left)/r.width-0.5)*2, y=((e.clientY-r.top)/r.height-0.5)*2; const n=Math.hypot(x,y); if(n>1){x/=n;y/=n;} set(x,y);};
  el.addEventListener('pointerdown',e=>{id=e.pointerId; el.setPointerCapture(id); mv(e);});
  el.addEventListener('pointermove',e=>{if(e.pointerId===id) mv(e);});
  const off=()=>{id=null; set(0,0);}; el.addEventListener('pointerup',off); el.addEventListener('pointercancel',off);}
bindJoy(document.getElementById('joy'),(x,y)=>{cmd.vx=x; cmd.vy=-y;});          // vx вправо по кадру, vy вверх по кадру
bindJoy(document.getElementById('joy2'),(x,y)=>{cmd.wyaw=-x; cmd.wpitch=-y;});  // вправо = ⟳ (yaw −), вверх = наклон вперёд
// направленная подсветка рамки кадра кисти: для каждой стены — красное свечение
// у края в направлении ang (0 = вправо, 90 = вверх), сила w; диагонали работают сами
const ov=document.getElementById('ov'), ox=ov.getContext('2d');
function drawBlocks(blocks, all){
  const w=ov.clientWidth, h=ov.clientHeight; if(!w||!h) return; if(ov.width!==w||ov.height!==h){ov.width=w;ov.height=h;}
  ox.clearRect(0,0,w,h); const R=Math.hypot(w,h)/2, cx=w/2, cy=h/2;
  if(all){const g=ox.createRadialGradient(cx,cy,R*0.55,cx,cy,R); g.addColorStop(0,'rgba(229,72,77,0)'); g.addColorStop(1,'rgba(229,72,77,0.55)'); ox.fillStyle=g; ox.fillRect(0,0,w,h);}
  for(const b of blocks){const a=b.ang*Math.PI/180, px=cx+Math.cos(a)*R*1.05, py=cy-Math.sin(a)*R*1.05;
    const g=ox.createRadialGradient(px,py,0,px,py,R*0.95); g.addColorStop(0,`rgba(229,72,77,${0.85*b.w})`); g.addColorStop(0.55,`rgba(229,72,77,${0.35*b.w})`); g.addColorStop(1,'rgba(229,72,77,0)');
    ox.fillStyle=g; ox.fillRect(0,0,w,h);}
}
// кнопки удержания
document.querySelectorAll('.hold').forEach(b=>{const k=b.dataset.k, v=+b.dataset.v;
  const on=e=>{e.preventDefault(); cmd[k]=v;}, off=()=>{cmd[k]=0;};
  b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off); b.addEventListener('pointercancel',off); b.addEventListener('pointerleave',off);});
const g=document.getElementById('grip'); g.addEventListener('input',()=>{cmd.grip=g.value/100; document.getElementById('gv').textContent=g.value+' %';});

// роль оператора и запись демонстраций (общее для всех страниц)
let myRole='viewer', recOn=false;
function applyRole(s){myRole=s.role||'viewer'; recOn=!!s.rec;
  const rb=document.getElementById('role'); if(rb){rb.textContent=myRole==='controller'?'управляю':'смотрю'; rb.classList.toggle('on',myRole==='controller');}
  const rc=document.getElementById('rec'); if(rc){rc.textContent=recOn?('● '+s.rec.ep+' '+s.rec.sec+'с'):'Запись'; rc.classList.toggle('on',recOn);}}
function bindRoleRec(){const rb=document.getElementById('role'), rc=document.getElementById('rec');
  if(rb) rb.onclick=()=>{if(myRole!=='controller') ws.send(JSON.stringify({cmd:'take'}));};
  if(rc) rc.onclick=()=>ws.send(JSON.stringify(recOn?{cmd:'rec_stop',success:true}:{cmd:'rec_start',task:'teleop'}));}
bindRoleRec();
document.getElementById('park').onclick=()=>ws.send(JSON.stringify({cmd:'park'}));
document.getElementById('home').onclick=()=>ws.send(JSON.stringify({cmd:'home'}));
document.getElementById('stop').onclick=()=>ws.send(JSON.stringify({cmd:stopped?'resume':'stop'}));
</script></body></html>
